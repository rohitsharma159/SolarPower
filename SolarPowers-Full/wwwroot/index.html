async function req(url,options={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});if(!r.ok){let msg='Request failed ('+r.status+')';try{msg=(await r.json()).error||msg}catch{}throw new Error(msg)}if(r.status===204)return null;return r.json()}
const db={collection:c=>({doc:id=>({set:async d=>{await req('/api/data/'+encodeURIComponent(c)+'/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(d)});await notify(c)},update:async d=>{await req('/api/data/'+encodeURIComponent(c)+'/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(d)});await notify(c)},delete:async()=>{await req('/api/data/'+encodeURIComponent(c)+'/'+encodeURIComponent(id),{method:'DELETE'});await notify(c)}}),onSnapshot:fn=>{(subs[c]=subs[c]||[]).push(fn);refresh(c,fn);}})};
async function refresh(c,fn){try{const rows=await req('/api/data/'+encodeURIComponent(c));fn({docs:rows.map(r=>({id:r.id,data:()=>{const x={...r};delete x.id;return x}}))})}catch(e){console.warn('Could not load '+c,e)}}
async function notify(c){await Promise.all((subs[c]||[]).map(fn=>refresh(c,fn)))}
const user={canEdit:()=>window.__solarAdmin===true,isOwner:()=>window.__solarAdmin===true};

window.solarLogin=async(username,password)=>{const r=await req('/api/auth/login',{method:'POST',body:JSON.stringify({username,password})});window.__solarAdmin=true;return r};
window.solarLogout=async()=>{await req('/api/auth/logout',{method:'POST',body:'{}'});window.__solarAdmin=false};

function sim(v){const h=+v,sol=Math.max(0,Math.sin((h-6)/12*Math.PI))*3,ld=h<8?1:h<17?.7:1.6,soc=h<7?25:h<14?25+(h-7)*10:h<18?95-(h-14)*5:75-(h-18)*12,net=sol-ld;const t=`${Math.floor(h)%12||12}:${h%1?"30":"00"} ${h<12?"AM":"PM"}`;const m=sol<=0?"It is night. Your home runs on the battery or the grid.":net>0?`Panels cover your home and have ${net.toFixed(1)} kW spare. It goes to the battery or the grid.`:`Sunlight is weak, so the battery or grid fills the ${(-net).toFixed(1)} kW gap.`;$("#sm").innerHTML=`<div style="text-align:center;font-size:${26+sol*8}px;margin:6px 0">${sol<=0?"🌙":"☀️"} → 🔆 → 🔌 → 🏠</div><b>${t}</b>`+bar("Solar output",sol/3,sol.toFixed(1)+" kW","#f59e0b")+bar("Home use",ld/3,ld.toFixed(1)+" kW","#3b82f6")+bar("Battery",soc/100,Math.round(soc)+"%","#16a34a")+`<p class="mu" style="margin:0">${m}</p>`}
function apr(){const kwh=AP.reduce((s,x,i)=>s+aq[i]*x[2]*x[3]/1000,0),kw=Math.max(1,Math.ceil(kwh/4*1.25*2)/2);$("#ar").innerHTML=`<div class="stats"><div><b>${kwh.toFixed(1)}</b>units / day</div><div><b>${Math.round(kwh*30)}</b>units / month</div><div><b>${kw} kW</b>suggested system</div><div><b>${Math.ceil(kw*1000/540)}</b>panels (540W)</div></div>`}
function apl(i,d){aq[i]=Math.max(0,Math.min(20,aq[i]+d));$("#q"+i).textContent=aq[i];apr()}
function quizHTML(){const Q=[["g","Is grid electricity available at your place?",["Yes","No"]],["c","How often do you face power cuts?",["Rarely","Sometimes","Often"]],["t","What matters most to you?",["Lowest bill","Backup power","Both"]]];let r="";if(qz.g&&qz.c&&qz.t){const k=qz.g=="No"?"Off-grid":(qz.c=="Often"||qz.t!="Lowest bill")?"Hybrid":"On-grid";const w={"Off-grid":"With no grid you need panels, an off-grid inverter and a battery bank.","Hybrid":"You want backup or face cuts, so a hybrid inverter with a battery fits best.","On-grid":"Grid is reliable and you want the lowest cost, so on-grid with net metering fits best."}[k];r=`<div class="ok" style="background:var(--bg);border-radius:12px;margin-top:10px"><div style="font-size:40px">🎯</div><h3>We suggest: ${k}</h3><p class="mu">${w}</p><button class="btn" onclick="cf='Inverters';go('shop')">Browse inverters →</button></div>`}return `<div class="form" style="max-width:none;margin-top:14px"><h3 style="margin-top:0">🧭 Which system suits you?</h3>${Q.map(([k,q,o])=>`<div class="mu" style="margin-top:8px">${q}</div><div class="chips">${o.map(x=>`<span class="chip ${qz[k]==x?"on":""}" onclick="qz.${k}='${x}';render()">${x}</span>`).join("")}</div>`).join("")}${r}</div>`}
function learnHTML(){if(lt=="Basics")return `<div class="steps">${[["☀️","1. Sunlight","Sun rays hit the solar panels on your roof."],["⚡","2. DC power","Panels convert light into DC electricity."],["🔌","3. Inverter","The inverter changes DC into usable AC power."],["🏠","4. Your home","Appliances use it. Extra goes to a battery or the grid."]].map(([i,t,d])=>`<div class="card"><span>${i}</span><h3>${t}</h3><div class="mu">${d}</div></div>`).join("")}</div><div class="form" style="max-width:none"><h3 style="margin-top:0">☀️ A day with solar</h3><div class="mu">Drag the slider to move through the day (example: 3 kW system with battery)</div><input type="range" min="5" max="19.5" step="0.5" value="12" oninput="sim(this.value)"><div id="sm"></div></div><h3>Why go solar?</h3><div class="grid">${[["♻️ Renewable","The sun's fuel is free and never runs out."],["💰 Lower bills","A well-sized rooftop system can cut your bill by up to 90%."],["🌍 Clean","No smoke or noise, and fewer carbon emissions than coal power."],["🔧 Low upkeep","No moving parts in panels, so you mostly just clean them."]].map(([t,d])=>`<div class="card"><h3>${t}</h3><div class="mu">${d}</div></div>`).join("")}</div>`;
if(lt=="System types")return `<div class="grid">${[["On-grid","Cheapest","Lowest cost and net metering savings|No battery to replace|Stops during grid cut"],["Off-grid","Remote areas","Works with no grid at all|Full power independence|Needs big batteries, higher cost"],["Hybrid","Best of both","Backup during cuts|Net metering possible|Costs more than on-grid"]].map(([t,tg,l])=>`<div class="card"><h3>${t}</h3><span class="tag">${tg}</span><ul class="sys">${l.split("|").map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>${quizHTML()}`;
if(lt=="Appliance planner")return `<div class="form" style="max-width:none"><h3 style="margin-top:0">🔌 Plan your system by appliances</h3><div class="mu">Set how many of each appliance you use. Watts and daily hours are typical values.</div>${AP.map((x,i)=>`<div class="rs"><span>${x[1]} ${x[0]} <span class="mu">${x[2]}W · ${x[3]}h/day</span></span><span><button class="btn o" onclick="apl(${i},-1)">−</button> <b id="q${i}">${aq[i]}</b> <button class="btn" onclick="apl(${i},1)">+</button></span></div>`).join("")}<div id="ar" style="margin-top:12px"></div><p class="mu">Estimate with a 25% safety margin and 4 sun-hours per day. An installer should confirm the final size.</p></div>`;
if(lt=="Components")return `<div class="grid">${COMP.map(([t,d])=>`<details class="card"><summary>${t}</summary><p>${d}</p></details>`).join("")}</div><p class="mu">Tap a card to read more.</p>`;
if(lt=="FAQ")return `<div style="display:grid;gap:10px;max-width:760px">${FAQ.map(([q,d])=>`<details class="card"><summary>${q}</summary><p>${d}</p></details>`).join("")}</div>`;
if(lt=="Myths")return `<p class="mu">Tap a card to reveal the truth.</p><div class="grid">${MY.map(([m,t])=>`<div class="flip" onclick="this.classList.toggle('on')"><div class="ff"><b>❌ Myth</b><br>${m}<small>Tap to flip</small></div><div class="fb"><b>✅ Fact</b><br>${t}</div></div>`).join("")}</div>`;
return `<div class="form" style="max-width:none"><h3 style="margin-top:0">How big a system do you need?</h3><div class="mu">Your monthly electricity bill: <b id="bv"></b></div><input type="range" min="500" max="20000" step="500" value="${bill}" oninput="calc(this.value)"><div id="cr"></div><p class="mu">Rough estimate only: assumes ₹8 per unit, 4 units per kW per day and about ₹55,000 per kW before any subsidy. Real prices depend on your site and state.</p><button class="btn" onclick="askBill()">💬 Get a recommendation from Solar Expert</button></div>`}

else if(page=="shop"){const cats=["All",...new Set(prods().map(p=>p.cat))];a.innerHTML=`<h2>Shop</h2><div class="bar"><input placeholder="🔍 Search solar products…" value="${esc(q)}" oninput="q=this.value;sg()"><select onchange="so=this.value;sg()"><option value="">Sort: Featured</option><option value="l" ${so=="l"?"selected":""}>Price: Low to High</option><option value="h" ${so=="h"?"selected":""}>Price: High to Low</option></select></div><div class="tabs">${cats.map(c=>`<span class="chip ${cf==c?"on":""}" onclick="cf='${esc(c)}';render()">${esc(c)}</span>`).join("")}</div><div class="mu" id="rc"></div><div class="grid" id="sg"></div>`;sg()}

else if(page=="contact")a.innerHTML=`<h2>Get in touch</h2><div class="ct"><div>${[["📍","Showroom","Pan-India delivery · showroom details coming soon"],["📞","Call us","+91 00000 00000"],["✉️","Email","info@solarpowers.com"],["🕘","Hours","Mon–Sat, 9am–7pm"]].map(([i,t,d])=>`<div class="card ic"><span>${i}</span><div><b>${t}</b><div class="mu">${d}</div></div></div>`).join("")}</div><div class="form" id="cf" style="max-width:none"><h3 style="margin-top:0">Send us a message</h3><div class="fl"><input id="n" placeholder=" "><label>Your name</label></div><div class="two"><div class="fl"><input id="e" placeholder=" "><label>Email</label></div><div class="fl"><input id="ph" placeholder=" "><label>Phone</label></div></div><div class="mu">What is this about?</div><div class="chips">${["Product info","Quotation","Installation","Other"].map((x,i)=>`<span class="chip ${i?"":"on"}" onclick="pick(this)">${x}</span>`).join("")}</div><div class="fl"><textarea id="q" rows="4" placeholder=" "></textarea><label>Your message</label></div><button class="btn big" onclick="sendC()">Send message →</button></div></div>`;
else if(page=="feedback"){rt=0;a.innerHTML=`<h2>Feedback</h2><div class="form" id="ff" style="margin:auto;text-align:center"><div class="mu">How was your experience with Solarpowers?</div><div class="stars" id="st" style="justify-content:center;margin:8px 0">${[1,2,3,4,5].map(i=>`<span onclick="rate(${i})" onmouseover="hov(${i})" onmouseout="hov(rt)">★</span>`).join("")}</div><div class="mu" id="rl" style="margin-bottom:10px">Tap a star to rate</div><div class="chips" style="justify-content:center">${["Website","Products","Delivery","Support"].map((x,i)=>`<span class="chip ${i?"":"on"}" onclick="pick(this)">${x}</span>`).join("")}</div><div style="text-align:left"><div class="fl"><input id="n" placeholder=" "><label>Your name</label></div><div class="fl"><input id="e" placeholder=" "><label>Email (optional)</label></div><div class="fl"><textarea id="q" rows="4" maxlength="300" placeholder=" " oninput="$('#cc').textContent=this.value.length+'/300'"></textarea><label>Tell us more</label></div><div class="cnt" id="cc">0/300</div></div><button class="btn big" onclick="sendF()">Submit feedback</button></div>`}
else if(page=="cart"){const t=cart.reduce((s,p)=>s+ +p.price,0);a.innerHTML=`<h2>Cart</h2>${cart.length?cart.map((p,i)=>`<div class="card" style="flex-direction:row;justify-content:space-between;align-items:center;margin-bottom:8px"><span>${esc(p.name)}</span><span>${rs(p.price)} <button class="btn r" onclick="cart.splice(${i},1);nav();render()">✕</button></span></div>`).join("")+`<h3>Total: ${rs(t)}</h3><div class="form"><input id="n" placeholder="Name"><input id="ph" placeholder="Phone"><textarea id="ad" rows="2" placeholder="Address"></textarea><button class="btn" onclick="order()">Place order (pay on delivery)</button></div>`:`<p class="mu">Your cart is empty.</p>`}`}
